# CI for dashboard-app.
#
# Pipeline order (matches the Phase E plan):
#   1. typecheck   — `tsc --noEmit`
#   2. unit        — `vitest run` (fast inner loop, no coverage)
#   3. coverage    — `vitest run --coverage` (same suite, gated at ≥80%)
#   4. build       — `next build` (only runs once 1-3 pass)
#   5. e2e         — Playwright against a live Postgres + mock-supabase
#                    app. Runs ONLY after coverage passes so a coverage
#                    regression short-circuits the long-running browser
#                    suite before it consumes runner minutes.
#
# Postgres is provided as a service so the e2e tests can hit migrations
# exactly as a developer would when running locally.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run when the same branch pushes a new commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit

  # Runs after typecheck succeeds. Cheap inner loop (no coverage), so
  # it stays under the 5-minute budget regardless of suite size.
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Vitest (no coverage)
        run: npm run test:unit

  # Coverage gates the pipeline. Fails closed at the ECC thresholds
  # declared in vitest.config.ts (lines/functions/branches/statements
  # ≥80%). Only after this passes does the build + e2e jobs unlock.
  coverage:
    name: coverage gate (≥80%, ECC)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Vitest + v8 coverage
        # vitest.config.ts thresholds fail-closed; CI stops here if a
        # regression drops any metric below 80%.
        run: npm run test:unit:coverage

  build:
    name: next build
    runs-on: ubuntu-latest
    needs: coverage
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Production build
        env:
          MOCK_SUPABASE: 1
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key-replace-me
        run: npm run build

  # Playwright E2E runs ONLY after coverage passes. With the dependency
  # chain `typecheck → unit → coverage → build → e2e`, a coverage miss
  # short-circuits the ~20-minute browser suite before it consumes
  # runner minutes.
  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install psql + Playwright browsers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          npx playwright install --with-deps chromium
      - name: Apply migrations to live postgres
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -v ON_ERROR_STOP=1 -f supabase/seed.sql
      - name: Run Playwright (chromium only in CI)
        env:
          MOCK_SUPABASE: 1
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key-replace-me
        run: npx playwright test --project=chromium --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Real-mode e2e: exercises GoTrue + Realtime v3 + Meta via the docker-compose
  # stack. Brings the stack up with `db:stack` (which runs db-sync, gen-keys,
  # docker compose, db:wait, and db:seed-auth), then runs Playwright against
  # the realmode project. Depends on `build` because the production bundle is
  # what the realmode specs exercise (`npm run start`), not `next dev`.
  #
  # Auth tokens are sourced from `.env.compose` (regenerated by gen-keys.js
  # and rewritten into the file on every db:reset). Both spec files and the
  # server read the same env so cookies minted by one process are valid for
  # the other.
  e2e-realmode:
    name: playwright e2e (real supabase, docker-compose)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install psql + Playwright browsers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          npx playwright install --with-deps chromium
      - name: Bring up the Supabase stack (db + REST + GoTrue + Realtime + Meta + gateway)
        id: stack
        run: |
          npm run db:stack
          # db:stack emits ANON_KEY + SERVICE_ROLE_KEY into .env.compose via
          # gen-keys.js; expose them as step outputs so the playwright step can
          # forward them as runtime env vars.
          {
            echo "anon_key=$(grep '^ANON_KEY=' .env.compose | cut -d= -f2-)"
            echo "service_role_key=$(grep '^SERVICE_ROLE_KEY=' .env.compose | cut -d= -f2-)"
          } >> "$GITHUB_OUTPUT"
      - name: Run Playwright (realmode project)
        env:
          MOCK_SUPABASE: 0
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.stack.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.stack.outputs.service_role_key }}
          PORT: 3000
        run: |
          # The realmode project skips Playwright's auto webServer (see
          # playwright.config.ts: realmodeOnly branch) because CI brings
          # the Next.js server up manually with the real-mode env. Run it
          # in the background, wait for the port to open, then drive
          # Playwright. The teardown step kills the bg process via the
          # PID we record.
          npm run start -- -p 3000 &
          echo $! > .next-server.pid
          # Wait for the server to listen before launching Playwright.
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/login; then
              break
            fi
            sleep 1
          done
          npx playwright test --project=realmode --workers=1
      - if: always()
        run: |
          if [ -f .next-server.pid ]; then
            kill "$(cat .next-server.pid)" 2>/dev/null || true
          fi
          docker compose down -v
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-realmode
          path: |
            playwright-report
            test-results
          retention-days: 7
