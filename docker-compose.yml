# Local Supabase stack for Phase E dev.
# Use `npm run db:up` to start, `npm run db:down` to stop, `npm run db:reset` to wipe + reseed.
#
# NOTE: This is a minimal, self-contained stack for local development only.
# For production, use Supabase Cloud (https://supabase.com) or a managed instance.
#
# If you do not have Docker installed, set MOCK_SUPABASE=1 in .env.local and the
# app will use an in-memory adapter (no real Postgres, no RLS verification).

services:
  postgres:
    image: postgres:16-alpine
    container_name: sunext-postgres
    restart: unless-stopped
    ports:
      - "54322:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - sunext-postgres-data:/var/lib/postgresql/data
      # postgres:16-alpine's entrypoint only processes FILES in this dir,
      # not subdirectories. We flatten migrations + seed into /tmp/sunext-initdb.
      - /tmp/sunext-initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # GoTrue-compatible auth (lightweight, no full Supabase Studio required for dev).
  # For full Supabase locally, use `npx supabase start` after installing the CLI.
  # This minimal setup gives us Postgres + a thin auth shim via the @supabase/ssr
  # client pointed at Postgres directly when SUPABASE_AUTH_SHIM=1.
  postgrest:
    image: postgrest/postgrest:v12.2.0
    container_name: sunext-postgrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@postgres:5432/postgres
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: dev-only-do-not-use-in-prod
      PGRST_SERVER_PORT: 3001
    ports:
      - "3001:3001"

volumes:
  sunext-postgres-data:
    driver: local
